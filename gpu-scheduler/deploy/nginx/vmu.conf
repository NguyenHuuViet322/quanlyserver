# /etc/nginx/sites-available/vmu — REQ-DP-02, REQ-US-10. install.sh thay __DOMAIN__, __APP__.
# Chứng chỉ: /etc/letsencrypt/live/__DOMAIN__/ (certbot) hoặc /etc/vmu/tls/ (tự ký, --self-signed).

# Không ghi Cookie, không ghi body; chỉ đường dẫn, mã trả về, thời gian
log_format vmu '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __DOMAIN__;

    ssl_certificate __CERT__;
    ssl_certificate_key __KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/vmu.access.log vmu;
    client_max_body_size 1m;

    root __APP__/frontend/src;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Response chứa mật khẩu SSH: không ghi log (REQ-US-10)
    location /api/me/password {
        access_log off;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
