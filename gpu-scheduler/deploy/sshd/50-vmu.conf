# /etc/ssh/sshd_config.d/50-vmu.conf — docs/10-design/ssh.md, REQ-CT-08..10
# Chuyển tiếp cổng KHÔNG diễn ra ở máy chủ: dùng SSH thẳng vào container (vmu-connect, REQ-CT-11).
# PermitUserEnvironment không được phép trong Match; mặc định của sshd đã là "no".
# Cấu hình chính cần: UsePAM yes (đổi mật khẩu hết hạn trước khi ForceCommand chạy — REQ-US-11)
Match Group vmu-users
    ForceCommand /usr/local/bin/vmu-enter
    PasswordAuthentication yes
    KbdInteractiveAuthentication yes
    X11Forwarding no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    PermitTunnel no
    GatewayPorts no
    AllowTcpForwarding no
