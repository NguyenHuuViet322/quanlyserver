# /etc/ssh/sshd_config.d/50-vmu.conf — docs/10-design/ssh.md, REQ-CT-08..10
# 40-vmu-users.conf (tự sinh) đứng trước file này và đặt PermitOpen riêng cho từng user.
# Cấu hình chính cần: UsePAM yes (đổi mật khẩu hết hạn trước khi ForceCommand chạy — REQ-US-11)
Match Group vmu-users
    ForceCommand /usr/local/bin/vmu-enter
    PasswordAuthentication yes
    KbdInteractiveAuthentication yes
    PermitUserEnvironment no
    X11Forwarding no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    PermitTunnel no
    GatewayPorts no
    AllowTcpForwarding local
    PermitOpen none
